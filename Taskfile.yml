version: "3"

vars:
  APP_NAME: quadboard
  CMD_DIR: ./cmd/quadboard
  BIN_DIR: ./bin

  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown

  DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"

  # Frontend variables
  ESBUILD_VERSION: "0.20.2"
  ESBUILD_BIN: "{{.BIN_DIR}}/esbuild"
  WEB_SRC_DIR: "internal/web/src"
  WEB_DIR: "internal/http/view/assets"
  JS_SRC: "{{.WEB_SRC_DIR}}/js/app.js"
  JS_MIN: "{{.WEB_DIR}}/js/app.min.js"
  CSS_SRC: "{{.WEB_SRC_DIR}}/css/style.css"
  CSS_MIN: "{{.WEB_DIR}}/css/style.min.css"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  tools:esbuild:
    internal: true
    status:
      - test -f {{.ESBUILD_BIN}}
    cmds:
      - go install github.com/evanw/esbuild/cmd/esbuild@v{{.ESBUILD_VERSION}}
      - mkdir -p {{.BIN_DIR}}
      - mv $(go env GOPATH)/bin/esbuild {{.ESBUILD_BIN}}

  build-frontend:
    desc: Bundle and minify JS and CSS for production
    deps: [tools:esbuild]
    cmds:
      - "{{.ESBUILD_BIN}} {{.JS_SRC}} --bundle --minify --format=iife --outfile={{.JS_MIN}}"
      - "{{.ESBUILD_BIN}} {{.CSS_SRC}} --minify --outfile={{.CSS_MIN}}"

  build-frontend-dev:
    desc: Bundle JS and CSS for development (no minification)
    deps: [tools:esbuild]
    cmds:
      - "{{.ESBUILD_BIN}} {{.JS_SRC}} --bundle --format=iife --outfile={{.JS_MIN}}"
      - "{{.ESBUILD_BIN}} {{.CSS_SRC}} --outfile={{.CSS_MIN}}"

  build:
    desc: Build QuadBoard
    deps: [build-frontend]
    cmds:
      - templ generate ./...
      - mkdir -p {{.BIN_DIR}}
      - >
        go build
        -ldflags="
        -X github.com/dokod-fr/quadboard/internal/version.Version={{.VERSION}}
        -X github.com/dokod-fr/quadboard/internal/version.Commit={{.COMMIT}}
        -X github.com/dokod-fr/quadboard/internal/version.Date={{.DATE}}
        "
        -o {{.BIN_DIR}}/{{.APP_NAME}}
        {{.CMD_DIR}}

  release:
    desc: Build release binary
    cmds:
      - task: clean
      - task: build

  run:
    desc: Run the application
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}} serve

  test:
    desc: Run all unit tests
    cmds:
      - go test ./...

  coverage:
    desc: Run unit tests and display code coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  coverage-html:
    desc: Generate an HTML code coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .
      - gofumpt -w .

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - find . -name "*_templ.go" -delete
      - rm -f {{.JS_MIN}} {{.CSS_MIN}}

  check:
    desc: Run all verification tasks
    deps:
      - fmt
      - lint
      - test

  dev:
    desc: Run app in development mode (builds unminified frontend)
    deps: [build-frontend-dev]
    cmds:
      - templ generate ./...
      - go run ./cmd/quadboard serve

  docker-build:
    desc: Build the Docker image using BuildKit
    env:
      DOCKER_BUILDKIT: "1"
    cmds:
      - >
        docker build
        --build-arg VERSION={{.VERSION}}
        --build-arg COMMIT={{.COMMIT}}
        --build-arg DATE={{.DATE}}
        -t {{.APP_NAME}}:latest
        .

  docker-run:
    desc: Build image and start the compose development environment
    deps:
      - docker-build
    cmds:
      - docker compose -f examples/docker-compose/docker-compose.yml up -d

  docker-stop:
    desc: Stop the compose development environment
    cmds:
      - docker compose -f examples/docker-compose/docker-compose.yml down