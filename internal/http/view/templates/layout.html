<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuadBoard</title>
    
    <!-- Favicons adaptatifs (jour / nuit) -->
    <link rel="icon" type="image/svg+xml" href="/assets/img/quadboard-color.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="/assets/img/quadboard-bw.svg" media="(prefers-color-scheme: dark)">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/assets/js/app.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="brand">
            <div class="logo-container">
                <img src="/assets/img/quadboard-color.svg" alt="QuadBoard" class="logo logo-light">
                <img src="/assets/img/quadboard-bw.svg" alt="QuadBoard" class="logo logo-dark">
            </div>
            <h1>QuadBoard</h1>
        </div>
        <div class="header-actions">
            <!-- button search box -->
            <div class="search-box">
                <input type="text" id="search-input" class="search-input" placeholder="Search services..." autocomplete="off">
                <i data-lucide="search" class="search-icon"></i>
            </div>
            <!-- button group/ungroup -->
            <button id="group-toggle" class="btn-icon active" aria-label="Toggle grouping" title="Toggle grouping">
                <i data-lucide="group"></i>
            </button>
            <!-- button toggle dark/light mode -->
            <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme">
                <i data-lucide="sun-moon"></i>
            </button>
            {{if .Username}}
            <div class="user-profile">
                <i data-lucide="user-circle"></i>
                <span>{{.Username}}</span>
            </div>
            {{end}}
        </div>
    </header>
    <main class="container">
        {{template "content" .}}
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
